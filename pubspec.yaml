name: omstu_schedule
description: Расписание ОмГТУ - кроссплатформенное мобильное приложение.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^13.2.0
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  path_provider: ^2.1.1
  provider: ^6.1.1
  table_calendar: ^3.0.9
  http: ^1.6.0
  url_launcher: ^6.2.5
  cached_network_image: ^3.2.3
  shared_preferences: ^2.2.2
  html: ^0.15.4
  enough_convert: ^1.6.0
  adaptive_platform_ui: 0.1.111

# Вендоренный форк 0.1.111: в нативном сегментированном контроле на iOS 26
# тап по неактивному сегменту не анимировался. Причина и правки — в
# packages/adaptive_platform_ui/FORK.md. Убрать, когда починят в апстриме.
dependency_overrides:
  adaptive_platform_ui:
    path: packages/adaptive_platform_ui

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/data/

  # Inter лежит в ассетах, а не тянется через google_fonts с fonts.gstatic.com:
  # рантайм-загрузка означала запрос к Google на старте и системный шрифт
  # вместо Inter при первом запуске без сети.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
