publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  path_provider: ^2.1.1
  provider: ^6.1.1
  table_calendar: ^3.0.9
  http: ^1.6.0
  url_launcher: ^6.2.5 
  cached_network_image: ^3.2.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"

flutter:
  uses-material-design: true
